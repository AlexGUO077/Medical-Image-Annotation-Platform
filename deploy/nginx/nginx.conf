worker_processes auto;
pid /tmp/nginx.pid;
# Nginx request errors can include the full frame-ticket URL even at crit level.
# Validate configuration with nginx -t; business audit events remain in PostgreSQL.
error_log /dev/null;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 2g;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  server {
    listen 8080;
    server_name localhost;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://localhost:__HTTPS_PORT__$request_uri; }
  }
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/miap/tls/fullchain.pem;
    ssl_certificate_key /etc/miap/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    location /api/ {
      proxy_hide_header X-Content-Type-Options;
      proxy_pass http://server:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_buffering off;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
