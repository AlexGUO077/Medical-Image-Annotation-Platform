name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify project gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Version tags are documented in docs/security/wp-00-scan-policy.md.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run check:forbidden-files
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify backup failure and restore protection paths
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - run: docker compose --env-file .env.example config --quiet
      - name: Start synthetic PostgreSQL, Redis and ES for transaction tests
        run: |
          node scripts/create-local-env.mjs
          docker compose --env-file .env.local up -d --wait --wait-timeout 240 postgres redis elasticsearch
      - name: Verify task HTTP authorization and database transactions
        run: node server/test/tasks.integration.cjs
      - name: Provision dedicated synthetic search account
        run: npm run search:provision --workspace=server
      - name: Verify public frames and published library with real ES
        env:
          MIAP_TEST_SEARCH_ES: "1"
        run: node server/test/frame-api.integration.cjs
      - name: Stop synthetic test services
        if: always()
        run: |
          if [ -f .env.local ]; then
            docker compose --env-file .env.local down --volumes
          fi
