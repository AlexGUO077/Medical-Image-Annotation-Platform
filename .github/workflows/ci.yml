name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify project gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Version tags are documented in docs/security/wp-00-scan-policy.md.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run check:forbidden-files
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker compose --env-file .env.example config --quiet
      - name: Start synthetic PostgreSQL and Redis for transaction tests
        run: |
          node scripts/create-local-env.mjs
          docker compose --env-file .env.local up -d --wait --wait-timeout 180 postgres redis
      - name: Verify task HTTP authorization and database transactions
        run: node server/test/tasks.integration.cjs
      - name: Verify public frame authorization, rate limits and audit
        run: node server/test/frame-api.integration.cjs
      - name: Stop synthetic PostgreSQL and Redis
        if: always()
        run: |
          if [ -f .env.local ]; then
            docker compose --env-file .env.local down --volumes
          fi
