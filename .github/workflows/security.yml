name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      # Version tags are documented in docs/security/wp-00-scan-policy.md.
      - uses: actions/checkout@v7
      - name: Check repository content before retaining SARIF
        run: node scripts/check-forbidden-files.mjs
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: sarif-results
          upload: never
          upload-database: false
      - name: Retain private code-only SARIF diagnostics
        if: ${{ success() && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
      - name: Block CodeQL high and critical findings
        if: ${{ !cancelled() }}
        env:
          CODEQL_SARIF_PATH: ${{ steps.analyze.outputs.sarif-output }}
        run: node scripts/check-sarif-security.mjs "$CODEQL_SARIF_PATH"

  dependency-policy:
    name: Whole-lock dependency and license policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Enforce whole-lock license policy and record evidence
        run: node scripts/check-dependency-policy.mjs package-lock.json
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy filesystem and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: node_modules,.git

  trivy-images:
    name: Trivy image scan (${{ matrix.service }} @ ${{ matrix.digest }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.service == 'server' && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: postgres
            image: miap/postgres:16.16-alpine3.24
            source: postgres:16.16-alpine3.24
            digest: sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
            context: .
            dockerfile: docker/postgres/Dockerfile
          - service: orthanc
            image: miap/orthanc:26.9.0-os-20261126
            source: orthancteam/orthanc
            digest: sha256:1ca07ad4a70f67f815e55a558e76718d572ed9d0571268a3fbc1516a9155c5ca
            context: .
            dockerfile: docker/orthanc/Dockerfile
          - service: minio
            image: miap/minio:2026-11-23-hardened
            source: cgr.dev/chainguard/minio
            digest: sha256:f6243be11aaaa2fe654d260558e2b3fcef50135e78a3abfd0db802b13444f059
            context: .
            dockerfile: docker/minio/Dockerfile
          - service: redis
            image: miap/redis:7.4.12-alpine3.22
            source: redis:7.4.12-alpine3.22
            digest: sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
            context: .
            dockerfile: docker/redis/Dockerfile
          - service: elasticsearch
            image: miap/elasticsearch:8.19.26-hardened
            source: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.19.26
            digest: sha256:1c58031eac1f9482d670fb0766c166f723eca098f1394477e63d2b9428ad6ace
            context: .
            dockerfile: docker/elasticsearch/Dockerfile
          - service: server
            image: miap/server:wp16-20261126
            source: ubuntu:26.04
            digest: sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
            context: .
            dockerfile: deploy/server/Dockerfile
          - service: nginx
            image: miap/nginx:wp16-20261126
            source: nginx:1.31.10-alpine3.24
            digest: sha256:7fc0fb4af7bf006aeb31aea88069976060f8f0a0a86b667126742cc17f4e31ae
            context: .
            dockerfile: deploy/nginx/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build ${{ matrix.image }}
        run: docker build --pull=false --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}" "${{ matrix.context }}"

      # Version tags are documented in docs/security/wp-00-scan-policy.md.
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Verify Elasticsearch runtime and bundled dependency patches
        if: matrix.service == 'elasticsearch'
        run: python3 scripts/verify-elasticsearch-image.py "${{ matrix.image }}" linux/amd64
