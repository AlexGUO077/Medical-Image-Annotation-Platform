name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # Version tags are documented in docs/security/wp-00-scan-policy.md.
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
          output: sarif-results
      - name: Block CodeQL high and critical findings
        env:
          CODEQL_SARIF_PATH: ${{ steps.analyze.outputs.sarif-output }}
        run: node scripts/check-sarif-security.mjs "$CODEQL_SARIF_PATH"

  dependency-review:
    name: Dependency and license review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  dependency-audit:
    name: npm audit and license evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Record detected non-denied license identifiers
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const denied = new Set(['GPL-2.0', 'GPL-3.0', 'AGPL-1.0', 'AGPL-3.0']);
          const lockfile = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const licenses = new Set();
          for (const entry of Object.values(lockfile.packages)) {
            if (entry.license && !denied.has(entry.license)) licenses.add(entry.license);
          }
          const summary = licenses.size === 0
            ? 'No non-denied license identifiers were present in package-lock.json.\n'
            : `${[...licenses].sort().map((license) => `- ${license}`).join('\n')}\n`;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Detected non-denied licenses\n\n${summary}`);
          NODE

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy filesystem and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: node_modules,.git
