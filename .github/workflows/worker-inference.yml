name: Real worker inference

on:
  pull_request:
    paths:
      - '.github/workflows/worker-inference.yml'
      - 'server/workers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-inference:
    name: Synthetic ZIP, manual and attachment inference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install local inference dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1 libgl1 libglib2.0-0
          python -m pip install -r server/workers/requirements.txt
      - name: Run real OCR and NER on generated synthetic inputs
        run: python server/workers/verify_real_inference.py
