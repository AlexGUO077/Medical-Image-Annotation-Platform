name: Real worker inference

on:
  pull_request:
    paths:
      - '.github/workflows/worker-inference.yml'
      - 'server/workers/**'
      - 'server/test/m1-real.integration.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-inference:
    name: Synthetic ZIP, manual and attachment inference
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install local inference dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1 libgl1 libglib2.0-0
          python -m pip install -r server/workers/requirements.txt
      - name: Run real OCR and NER on generated synthetic inputs
        run: python server/workers/verify_real_inference.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Start isolated synthetic storage services
        run: |
          node scripts/create-local-env.mjs
          docker compose --env-file .env.local up -d --wait --wait-timeout 180 postgres orthanc minio redis
      - name: Verify Orthanc API authentication boundary
        run: |
          source .env.local
          unauthenticated="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${ORTHANC_PORT}/system")"
          authenticated="$(curl --silent --output /dev/null --write-out '%{http_code}' --user "${ORTHANC_USERNAME}:${ORTHANC_PASSWORD}" "http://127.0.0.1:${ORTHANC_PORT}/system")"
          test "$unauthenticated" = 401
          test "$authenticated" = 200
      - name: Run actual HTTP and storage acceptance with real OCR/NER
        run: |
          set -a
          source .env.local
          set +a
          npm run migration:run --workspace server
          npm run build --workspace server
          DEID_WORKER_PYTHON="$(which python)" node server/test/m1-real.integration.cjs
      - name: Diagnose failed synthetic storage startup
        if: failure()
        run: |
          if [ -f .env.local ]; then
            source .env.local
            echo "::add-mask::$ORTHANC_PASSWORD"
            docker compose --env-file .env.local ps
            docker compose --env-file .env.local logs --tail=80 orthanc
          fi
      - name: Stop synthetic services
        if: always()
        run: docker compose --env-file .env.local down --volumes
